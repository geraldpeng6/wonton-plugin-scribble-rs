# Scribble.rs：开源的网页版你画我猜，无账号，打开网页就能一起玩。上游 https://github.com/scribble-rs/scribble.rs（BSD-3-Clause）。
services:
  game:
    # 上游官方镜像。scratch 底镜像，容器里只有 /scribblers 一个可执行文件，按清单列表摘要固定。
    image: biosmarcel/scribble.rs:v0.9.14@sha256:9d1d651538de3a95e2d318f134ad9c1e9740945cb87835ac7c1cdfbd82a9c775
    environment:
      PORT: "8080"
      # 大厅公开指它出现在本实例首页的大厅列表里，家人打开插件就能点进去；实例只在网关登录后面，列表给不到外人。
      LOBBY_SETTING_DEFAULTS_PUBLIC: "true"
      # 所有玩家都经核心网关进来，应用看到的来源地址是同一个；上游默认每地址限 2 人，会把第三个家人挡在大厅外。
      # 取应用允许的上限（24），单个大厅还是受大厅人数上限约束。
      LOBBY_SETTING_DEFAULTS_CLIENTS_PER_IP_LIMIT: "24"
    # 没有健康检查：镜像里除 /scribblers 外没有任何可执行文件（无 shell、无 wget/curl），
    # 应用也没有健康子命令，容器内探测做不了；见 README 的「已知限制」。

x-wonton:
  spec: "0.12"
  id: app.scribble-rs.game
  version: 0.1.0
  kind: app
  title: { zh: 你画我猜（Scribble.rs）, en: Scribble.rs }
  description: { zh: "家人一起玩的你画我猜：一人画画，其他人抢猜词语", en: "A pictionary game for the family: one draws, everyone else guesses" }
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/create-lobby.jpg, screenshots/drawing.jpg]
  author: { name: wontonapp, url: https://github.com/wontonapp }
  homepage: https://github.com/scribble-rs/scribble.rs
  # 应用（scribble.rs）的许可证；插件包自己的许可证在 LICENSE 里。
  license: BSD-3-Clause
  tags:
    zh: [游戏, 家庭]
    en: [Games, Family]
  about:
    zh: |
      全家人一起玩的你画我猜：一个人照着词画画，其他人抢着猜，像聚会里的画图猜词游戏。

      打开插件，建一个大厅，家人在列表里点开就能加入，同一个局域网或在外网都行。
      内置词库没有中文，想用中文玩就把仓库里 words/中文词库.txt 的内容粘贴到「自定义词」。
    en: |
      A family pictionary game: one player draws the word, everyone else races to guess it.

      Open the plugin and create a lobby; family members join from the lobby list. The built-in word lists have no Chinese — paste the contents of words/中文词库.txt into "Custom words" to play in Chinese.
  release_notes: { zh: 第一版。, en: First release. }
  webui:
    service: game
    port: 8080
    # 应用没有账号体系，谁打开谁玩；网页仍然只在网关登录后面可达。
    sso: none
  tabs:
    - id: play
      title: { zh: 你画我猜, en: Play }
      icon: tabs/play.svg
      icon_selected: tabs/play-fill.svg
      path: /
  permissions: []
  # 上游镜像有 amd64 和 arm64（github.com/scribble-rs/scribble.rs 的 docker-image-update 工作流，v0.9.14 已核对）。
  # 上游没写最低内存；本机实测空闲约 13M（2026-11-12，scratch 镜像单进程），取 64M。
  requirements:
    arch: [amd64, arm64]
    memory: 64M
